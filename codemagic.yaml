workflows:
  flutter-workflow:
    name: Flutter Workflow
    environment:
      flutter: 3.13.0
      xcode: 15.0
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release
    artifacts:
      - build/ios/ipa/*.ipa
  ios-workflow:
    name: iOS Workflow
    environment:
      xcode: 15.0
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS
        script: |
          cd ios
          xcodebuild -project Runner.xcodeproj -scheme Runner -configuration Release -archivePath build/Runner.xcarchive archive
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportPath build -exportOptionsPlist exportOptions.plist
    artifacts:
      - build/Runner.xcarchive
      - build/*.ipa
