workflows:
  flutter-workflow:
    name: Flutter Workflow
    environment:
      flutter: 3.13.0
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
